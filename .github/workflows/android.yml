name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle Wrapper if Missing
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.2
        fi
        chmod +x gradlew

    - name: Bypass Signing Configurations
      run: |
        # build.gradle.kts থেকে সাইনিং কনফিগারেশন ব্লকটি সাময়িকভাবে ডিজেবল করার ট্রিক
        sed -i '/signingConfigs {/,/^    }/d' app/build.gradle.kts
        sed -i '/signingConfig = signingConfigs/d' app/build.gradle.kts

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
